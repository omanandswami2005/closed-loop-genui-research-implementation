name: Deploy to Cloud Run

# Builds the single app image (frontend + loop service) and deploys it to
# Cloud Run on every push to main. Auth is keyless Workload Identity
# Federation (infra/gcp/); no key is stored in the repository or its secrets.

on:
  push:
    branches: [main]
    paths:
      - backend/closedloop/**
      - backend/pyproject.toml
      - frontend/**
      - Dockerfile
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT: omni-505707
  REGION: us-central1
  SERVICE: genui
  IMAGE: us-central1-docker.pkg.dev/omni-505707/genui/app:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/151739080904/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: gh-deployer@omni-505707.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      # Cost guards: scale to zero when idle, one instance at most (sessions
      # live in memory), at most 200 real Gemini calls per day in total and
      # 3 live Gemini sessions per visitor IP per hour; past the daily cap the
      # interface keeps working on the deterministic fallback.
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" --image "$IMAGE" \
            --service-account "genui-backend@${PROJECT}.iam.gserviceaccount.com" \
            --allow-unauthenticated --port 8080 \
            --min-instances 0 --max-instances 1 --concurrency 40 --cpu 1 --memory 512Mi --timeout 60 \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${PROJECT},GOOGLE_CLOUD_LOCATION=global,GENUI_GEMINI_DAILY_CAP=200,GENUI_GEMINI_SESSIONS_PER_IP=3"
      - name: Smoke test
        run: |
          url=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format 'value(status.url)')
          curl -fsS "$url/api/health"
          curl -fsS "$url/" | grep -q "<title>"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
