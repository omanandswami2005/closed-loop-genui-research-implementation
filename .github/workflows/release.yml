# Publishes a GitHub release for every pushed version tag (v*), with the
# annotated tag message as the notes and the paper PDF attached. Zenodo
# archives each published release and mints its DOI.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          gh release create "$GITHUB_REF_NAME" paper/main.pdf#paper.pdf \
            --title "$GITHUB_REF_NAME" --notes-from-tag --verify-tag
