# Publishes a GitHub release: run it by hand with a version (e.g. v1.0.0).
# It tags the current commit, uses .github/release-notes/<version>.md as the
# notes and attaches the paper PDF. Zenodo archives each published release
# and mints its DOI.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" paper/closed-loop-genui.pdf#closed-loop-genui.pdf \
            --target "$GITHUB_SHA" --title "$VERSION" \
            --notes-file ".github/release-notes/$VERSION.md"
