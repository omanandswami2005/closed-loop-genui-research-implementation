name: Deploy demo extension to Cloud Run

# Builds Dockerfile.demo (research app + /api/demo) and deploys it as the
# separate Cloud Run service "genui-demo". The research service "genui" and
# its workflow (deploy.yml) are not touched. Same keyless auth (infra/gcp/).

# Runs on main (and by hand). Pushes from long branch names cannot use it:
# their OIDC subject exceeds the Workload Identity 127-byte limit.
on:
  push:
    branches: [main]
    paths:
      - backend/closedloop/**
      - backend/closedloop_demo/**
      - backend/requirements-demo.txt
      - frontend/**
      - Dockerfile.demo
      - .github/workflows/deploy-demo.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  PROJECT: omni-505707
  REGION: us-central1
  SERVICE: genui-demo
  IMAGE: us-central1-docker.pkg.dev/omni-505707/genui/genui-demo:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/151739080904/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: gh-deployer@omni-505707.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f Dockerfile.demo -t "$IMAGE" .
          docker push "$IMAGE"
      # One instance (learners and sessions live in memory), scale to zero when
      # idle. Topic generation can take up to a minute, hence the longer timeout.
      # Research-mode Gemini keeps its guards; demo screens cap at 1500 per day.
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" --image "$IMAGE" \
            --service-account "genui-backend@${PROJECT}.iam.gserviceaccount.com" \
            --allow-unauthenticated --port 8080 \
            --min-instances 0 --max-instances 1 --concurrency 40 --cpu 1 --memory 1Gi --timeout 300 \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${PROJECT},GOOGLE_CLOUD_LOCATION=global,GENUI_GEMINI_DAILY_CAP=200,GENUI_GEMINI_SESSIONS_PER_IP=3,GENUI_DEMO_GEMINI_DAILY_CAP=1500"
      - name: Smoke test
        run: |
          url=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format 'value(status.url)')
          curl -fsS "$url/api/demo/health"
          curl -fsS "$url/api/health"
          curl -fsS "$url/demo.html" | grep -q "<title>"
          echo "Deployed to $url/demo.html" >> "$GITHUB_STEP_SUMMARY"
