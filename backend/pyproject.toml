[project]
name = "closedloop"
version = "0.1.0"
description = "Closed-loop mastery-constrained generative UI: BKT, PID governor, CLT-UI schema and in-silico benchmark"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
test = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
laya = ["laya>=0.3.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["closedloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
