[project]
name = "closedloop"
version = "0.1.0"
description = "Closed-loop mastery-constrained generative UI: BKT, PID governor, CLT-UI schema and in-silico benchmark"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["closedloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
